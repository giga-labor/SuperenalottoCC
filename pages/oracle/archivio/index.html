<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020a08">
  <title>Archivio previsioni — Oracolo del Chaos</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #020a08; color: #f4f6f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px 64px;
    }
    .oa-wrap { max-width: 880px; margin: 0 auto; }
    .oa-back {
      display: inline-flex; align-items: center; gap: 6px; color: #e8b928; text-decoration: none;
      font-size: 0.92rem; margin-bottom: 18px;
    }
    .oa-back:hover { text-decoration: underline; }
    h1 {
      font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.5rem, 4vw, 2.1rem);
      margin: 0 0 6px;
    }
    .oa-sub { color: #9aa39c; font-size: 0.95rem; margin: 0 0 28px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 0.94rem; }
    thead th {
      text-align: left; padding: 10px 12px; color: #e8b928; border-bottom: 1px solid rgba(232, 185, 40, 0.35);
      font-weight: 600; white-space: nowrap;
    }
    tbody td { padding: 12px; border-bottom: 1px solid rgba(244, 246, 242, 0.08); vertical-align: top; }
    tbody tr:hover { background: rgba(232, 185, 40, 0.05); }
    .oa-numbers { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .oa-hits { color: #e8b928; font-weight: 600; }
    .oa-empty { text-align: center; padding: 60px 20px; color: #9aa39c; font-family: Georgia, serif; font-size: 1.05rem; }
    .oa-error { text-align: center; padding: 60px 20px; color: #c98a8a; }
    @media (max-width: 560px) {
      table, thead, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tbody tr { border-bottom: 1px solid rgba(244, 246, 242, 0.12); padding: 12px 0; }
      tbody td { border: 0; padding: 4px 0; }
      tbody td::before { content: attr(data-label); display: block; font-size: 0.75rem; color: #9aa39c; margin-bottom: 2px; }
    }
  </style>
</head>
<body>
  <div class="oa-wrap">
    <a class="oa-back" href="/pages/oracle/">&larr; Torna all'Oracolo</a>
    <h1>Archivio delle previsioni</h1>
    <p class="oa-sub">Ogni responso rivelato dell'Oracolo, con i numeri proposti e quelli confermati dall'estrazione. Una previsione compare qui solo dopo che il concorso corrispondente è stato estratto.</p>
    <div id="oa-content">
      <div class="oa-empty">Caricamento…</div>
    </div>
  </div>
  <script>
    (function () {
      'use strict';

      function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }

      function fmtArr(arr) {
        return '[' + (arr || []).join(', ') + ']';
      }

      function render(entries) {
        var mount = document.getElementById('oa-content');
        if (!Array.isArray(entries) || entries.length === 0) {
          mount.innerHTML = '<div class="oa-empty">Nessuna previsione ancora rivelata. Torna dopo la prossima estrazione.</div>';
          return;
        }
        var rows = entries.map(function (item) {
          var concorso = esc(item.concorso);
          var data = esc(item.data);
          var proposte = fmtArr(item.proposte);
          var indovinati = fmtArr(item.indovinati);
          var hitClass = (item.indovinati && item.indovinati.length > 0) ? ' oa-hits' : '';
          return '<tr>' +
            '<td data-label="Concorso">' + concorso + '</td>' +
            '<td data-label="Data">' + data + '</td>' +
            '<td data-label="Proposte" class="oa-numbers">' + esc(proposte) + '</td>' +
            '<td data-label="Indovinati" class="oa-numbers' + hitClass + '">' + esc(indovinati) + '</td>' +
            '</tr>';
        }).join('');
        mount.innerHTML =
          '<table><thead><tr>' +
          '<th>Concorso</th><th>Data</th><th>Proposte</th><th>Indovinati</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table>';
      }

      fetch('../../../data/oracle-predictions-archive.json', { cache: 'no-store' })
        .then(function (response) { if (!response.ok) throw new Error('archive'); return response.json(); })
        .then(render)
        .catch(function () {
          document.getElementById('oa-content').innerHTML =
            '<div class="oa-error">Archivio non disponibile al momento.</div>';
        });
    })();
  </script>
</body>
</html>
